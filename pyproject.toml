[project]
authors = [{name = "Michael Berg-Mohnicke", email = "michael.berg@zalf.de"}]
dependencies = [
    "zalfmas-common>=0.1.42,<0.2",
    #"zalfmas-fbp>=0.2.33,<0.3"
]
name = "amei_exercises"
requires-python = ">= 3.12"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
