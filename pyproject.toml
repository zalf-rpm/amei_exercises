[project]
authors = [{ name = "Michael Berg-Mohnicke", email = "michael.berg@zalf.de" }]
name = "amei_exercises"
# Cap below 3.15: duckdb (via zalfmas-fbp) ships no cp315 wheels yet, so pixi would build the
# sdist, which needs a C++ toolchain that the Docker image doesn't have.
requires-python = ">=3.12,<3.15"
version = "0.1.0"
dependencies = [
    #"zalfmas-common>=0.1.48,<0.2",
    #"zalfmas-fbp>=0.2.37,<0.3",
    "zalfmas-capnp-schemas>=0.1.70,<0.2",
    "soiltexture>=1.0.4,<2",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1,<10",
  "ruff>=0.17.0,<0.18",
  "ty>=0.0.86,<0.0.87",
  "types-boto3[all,s3]>=1.43.111,<2",
  "basedpyright>=1.40.2,<2",
]

[tool.pixi.dependencies]
openpyxl = ">=3.1.5,<4"
pixi-pycharm = ">=0.0.12,<0.0.13"
pandas-stubs = ">=3.0.5.260914,<4"
numpy = ">=2.5.4,<3"
pydantic = ">=2.14.1,<3"
libsodium = ">=1.0.22,<2"

[tool.pixi.pypi-dependencies]
amei_exercises = { path = ".", editable = true }
#zalfmas-capnp-schemas = { path = "../mas_capnproto_schemas", editable = true }
zalfmas-common = ">=0.1.49, <0.2"
zalfmas-fbp = ">=0.2.40, <0.3"

[tool.pixi.environments]
dev = ["dev"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/amei_exercises", "src/flow_components"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "T",
    "G",
    "BLE",
    "COM",
    "PTH",
    "C417",
    "TRY",
    "ASYNC109",
    # "D100",
    # "D101",
]
ignore = ["E501", "COM812"]

[tool.basedpyright]
ignore = ["tests"]
typeCheckingMode = "basic"
venvPath = ".pixi/envs"
venv = "dev"

[tool.pixi.tasks]
components-service = { cmd = "python -m zalfmas_fbp.run.local_components_service configs/local_components_service.toml" }
regenerate-components-cache = { cmd = "python -m zalfmas_fbp.run.local_components_service configs/local_components_service.toml --regenerate_cache --force" }
channel-service = { cmd = "python -m zalfmas_fbp.run.channel_starter_service configs/local_channel_starter_service.toml" }
flow = { cmd = "python -m zalfmas_fbp.run.run_fbp_flow" }
