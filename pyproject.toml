[project]
authors = [{ name = "Michael Berg-Mohnicke", email = "michael.berg@zalf.de" }]
name = "amei_exercises"
requires-python = ">= 3.12"
version = "0.1.0"
dependencies = [
    "zalfmas-common>=0.1.48,<0.2",
    "zalfmas-capnp-schemas>=0.1.63,<0.2", "soiltexture>=1.0.4,<2",
    #"zalfmas-fbp>=0.2.35,<0.3"
]

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
  "ruff>=0.15.16,<0.16",
  "ty>=0.0.44,<0.0.45",
  "types-boto3[all,s3]>=1.43.23,<2",
  "basedpyright>=1.39.6,<2",
]

[tool.pixi.dependencies]
openpyxl = ">=3.1.5,<4"
pixi-pycharm = ">=0.0.11,<0.0.12"
pandas-stubs = ">=3.0.0.260204,<4"
numpy = ">=2.4.3,<3"
pydantic = ">=2.13.5,<3"
libsodium = ">=1.0.22,<2"

[tool.pixi.pypi-dependencies]
amei_exercises = { path = ".", editable = true }
#zalfmas-capnp-schemas = { path = "../mas_capnproto_schemas", editable = true }
#zalfmas-common = { path = "../mas_python_common", editable = true }
zalfmas-fbp = { path = "../mas_python_fbp", editable = true }

[tool.pixi.environments]
dev = ["dev"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/amei_exercises", "src/flow_components"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "T",
    "G",
    "BLE",
    "COM",
    "PTH",
    "C417",
    "TRY",
    "ASYNC109",
    # "D100",
    # "D101",
]
ignore = ["E501", "COM812"]

[tool.basedpyright]
ignore = ["tests"]
typeCheckingMode = "basic"
venvPath = ".pixi/envs"
venv = "dev"

[tool.pixi.tasks]
components-service = { cmd = "python -m zalfmas_fbp.run.local_components_service configs/local_components_service.toml" }
maricopa = { cwd="maricopa_wheat_face", cmd = "python -m zalfmas_fbp.run.run_fbp_flow run_maricopa_calib_flow_v16_min_win.json --cmds ../configs/local_cmds.json ../../mas_python_fbp/configs/local_cmds_win.json --components ../../mas_python_fbp/configs/local_components_cache.json ../configs/local_components_cache.json --path_to_channel=../../monica/build/common/channel.exe --channel_host=127.0.0.1 --host=127.0.0.1" }
flow = { cmd = "python -m zalfmas_fbp.run.run_fbp_flow" }
