# env.toml - example environment file for run_fbp_flow.py's --config/-e option
# Run with: python -m zalfmas_fbp.run.run_fbp_flow my_flow.json -e env.toml

# Optional: lets you omit the flow path on the command line entirely.
path_to_flow = "run_maricopa_calib_flow_v17_min.json"

# Repeated --cmds/-c files: just a TOML array of strings.
# Later entries win on duplicate component ids (same rule as passing
# multiple --cmds flags on the command line).
cmds = [
    "../configs/local_cmds.json",
    "../../mas_python_fbp/configs/local_cmds_win.json"
]

# Repeated --components/-m files work the same way.
components = [
    "../../mas_python_fbp/configs/local_components_cache.json",
    "configs/local_components_cache.json",
]

path_to_channel = "/home/berg/GitHub/monica/_cmake_debug/common/channel"
host = "127.0.0.1"
channel_host = "127.0.0.1"
log_level = "INFO"
component_log_level = "INFO"
verbose_channels = false
