[project]
name = "amei-exercises"
version = "0.1.0"
description = ""
requires-python = ">=3.12,<3.14"
authors = [{ name= "Michael Berg-Mohnicke", email = "michael.berg@zalf.de"}]
readme = "README.md"

dependencies = [
    "pycapnp>=2.2.2,<3",
    "zalfmas-common>=0.1.41,<0.2",
    "zalfmas-capnp-schemas>=0.1.57,<0.2",
]

#[tool.poetry.dependencies]
#python =  ">=3.10,<3.13"
#zalfmas-common = "^0.1.34"
#pyzmq = "^26.2.0"
#pandas = "^2.2.2"
#openpyxl = "^3.1.5"
#zalfmas-fbp = "^0.2.20"
#pandas-stubs = "~=2.3.3"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
libsodium = ">=1.0.22,<2"
pixi-pycharm = ">=0.0.11,<0.0.12"

[tool.pixi.pypi-dependencies]
amei-exercises = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]